# Production defaults. Secrets come from environment variables; nothing sensitive has a default.
spring:
  application:
    name: mockdraft
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/mockdraft}
    username: ${DB_USERNAME:mockdraft}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  sql:
    init:
      mode: never
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  mvc:
    problemdetails:
      enabled: false
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
  jackson:
    default-property-inclusion: always
  servlet:
    multipart:
      enabled: false

server:
  port: ${PORT:8080}
  # Trust X-Forwarded-* only from the reverse proxy (Tomcat's internal-proxies default = private networks)
  forward-headers-strategy: native
  shutdown: graceful
  error:
    whitelabel:
      enabled: false
    include-stacktrace: never
    include-message: never
  tomcat:
    max-http-form-post-size: 64KB
    max-swallow-size: 64KB
  max-http-request-header-size: 16KB

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  secure-cookies: ${APP_SECURE_COOKIES:true}
  allowed-origins: ${APP_ALLOWED_ORIGINS:}
  mail:
    from: ${MAIL_FROM:no-reply@localhost}

logging:
  level:
    root: INFO

---
# Local development without Docker: embedded H2 database file, reset links printed to the log.
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/mockdraft-dev;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;IGNORECASE=TRUE;AUTO_SERVER=TRUE
    username: sa
    password: ""
app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  mail:
    log-reset-links: true
logging:
  level:
    com.mockdraft: DEBUG
